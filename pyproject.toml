[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfclaw"
version = "1.0.0"
description = "A self-maintaining, token-minimal library of nf-core pipelines for AI agents."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# `mcp` is the official MCP SDK, used only to test `nfclaw mcp` against a real client.
dev = ["pytest>=8", "mcp>=1.9,<3"]
yaml = ["pyyaml>=6"]

[project.scripts]
nfclaw = "runner.cli:main"

[tool.setuptools]
packages = ["runner", "librarian"]

[tool.setuptools.package-data]
runner = ["path_roles.json", "input_roles.json", "param_roles.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["pipelines", "website"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
