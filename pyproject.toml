[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfclaw"
version = "1.0.0"
description = "A self-maintaining, token-minimal library of nf-core pipelines for AI agents."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# `mcp` is the official MCP SDK, used only to test `nfclaw mcp` against a real client. Ruff is held
# to one minor series: a new release adds stable rules to the selected families (`B`, `UP`).
dev = ["pytest>=8", "mcp>=1.9,<3", "ruff>=0.17,<0.18"]
yaml = ["pyyaml>=6"]
scientific = ["pysam>=0.24.1,<0.25", "h5py>=3.16,<4"]

[project.scripts]
nfclaw = "runner.cli:main"

[tool.setuptools]
packages = ["runner", "librarian"]

[tool.setuptools.package-data]
runner = ["path_roles.json", "input_roles.json", "param_roles.json", "output_contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["pipelines", "website"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These run under whatever python3 is at hand, not nfclaw's own interpreter: the replay scripts are
# copied into every provenance bundle, and the fastqrepair corrections run inside task containers.
# Keep them portable rather than modern.
"runner/replay_guard.py" = ["UP"]
"runner/environment_record.py" = ["UP"]
"runner/fastqrepair_compat.py" = ["UP"]
