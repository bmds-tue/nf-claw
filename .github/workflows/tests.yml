name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,yaml]"
      - run: pytest -q
      - run: pip install ruff && ruff check .

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run build
      # The site's markdown parser reads every generated skill.md. Its tests need node and the
      # site's own TypeScript, so they are skipped in the Python matrix and run here instead.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Website parsing of the generated skills
        working-directory: .
        run: |
          set -o pipefail
          pip install -e ".[dev]"
          pytest -q -rs tests/test_website_parsing.py | tee "$RUNNER_TEMP/website-parsing.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/website-parsing.log"; then
            echo "::error::website parsing tests were skipped instead of run"
            exit 1
          fi

  nextflow-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,yaml]"
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-nextflow
      - run: pytest -q tests/test_nextflow_integration.py tests/test_git_path_identity.py
