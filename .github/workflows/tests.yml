name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      base_sha:
        type: string
        default: ""
      candidate_sha:
        type: string
        default: ""
      candidate_artifact:
        type: string
        default: ""
# A new push to a pull request supersedes the run of its previous commit, which would otherwise keep
# its queued runners (macOS ones especially) busy. Every other run is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/restore-maintenance-candidate
        with:
          artifact: ${{ inputs.candidate_artifact }}
          base: ${{ inputs.base_sha }}
          sha: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm --prefix website ci --ignore-scripts --no-audit --no-fund
      - name: GNU checksum and timeout tools on macOS
        if: runner.os == 'macOS'
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-nextflow
      # h5py 3.16 has no Python 3.15 wheel. Linux builds it against the distro's development
      # library; macOS 3.15 keeps the runner/BAM/VCF lane until a wheel is available. H5AD runs in
      # the macOS 3.11–3.14 CI lanes and every Linux lane (3.15 is a source build).
      - name: HDF5 development library for the Python 3.15 source build
        if: matrix.python == '3.15' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libhdf5-dev
      - name: Install tests and scientific adapters
        if: matrix.python != '3.15' || runner.os == 'Linux'
        run: pip install -e ".[dev,yaml,scientific]"
      - name: Install runner and HTS tests on macOS Python 3.15
        if: matrix.python == '3.15' && runner.os == 'macOS'
        run: pip install -e ".[dev,yaml]" "pysam>=0.24.1,<0.25"
      - name: Execute the complete Python suite
        env:
          LANE_OS: ${{ matrix.os }}
          LANE_PYTHON: ${{ matrix.python }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pytest-evidence/$LANE_OS-$LANE_PYTHON"
          mkdir -p "$evidence"
          # One worker per runner core (pytest-xdist); idle workers take queued tests from busy
          # ones (worksteal), so the slow Nextflow integration tests do not leave one worker
          # running alone at the end. The report still holds every case.
          pytest -q -n auto --dist worksteal --junitxml="$evidence/report.xml"
          python scripts/check_maintenance_pytest.py --report "$evidence/report.xml" \
            --os "$LANE_OS" --python "$LANE_PYTHON" --candidate "$CANDIDATE_SHA" \
            --output "$evidence/record.json"
      - run: ruff check .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && inputs.candidate_sha != ''
        with:
          name: maintenance-pytest-${{ inputs.candidate_sha }}-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/pytest-evidence
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (inputs.candidate_sha == '' || failure() || cancelled())
        with:
          name: pytest-diagnostics-${{ inputs.candidate_sha || github.sha }}-${{ matrix.os }}-${{ matrix.python }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pytest-evidence
          if-no-files-found: error
          retention-days: 90

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: ./.github/actions/restore-maintenance-candidate
        with:
          artifact: ${{ inputs.candidate_artifact }}
          base: ${{ inputs.base_sha }}
          sha: ${{ inputs.candidate_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # The site's markdown parser reads every generated skill.md. Its tests need node and the
      # site's own TypeScript; this dedicated site gate also refuses a skipped parser test.
      - name: Website parsing of the generated skills
        working-directory: .
        run: |
          set -o pipefail
          pip install -e ".[dev]"
          pytest -q -rs tests/test_website_parsing.py | tee "$RUNNER_TEMP/website-parsing.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/website-parsing.log"; then
            echo "::error::website parsing tests were skipped instead of run"
            exit 1
          fi
      - name: The site serves the repository's own llms.txt
        run: cmp ../llms.txt out/llms.txt

  nextflow-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: ./.github/actions/restore-maintenance-candidate
        with:
          artifact: ${{ inputs.candidate_artifact }}
          base: ${{ inputs.base_sha }}
          sha: ${{ inputs.candidate_sha }}
      - run: pip install -e ".[dev,yaml]"
      - uses: ./.github/actions/setup-nextflow
      - run: pytest -q tests/test_nextflow_integration.py tests/test_git_path_identity.py tests/test_timeout_integration.py
