name: discover-pipelines
# Discover and preview candidates, then require full-matrix and real-task gates before publication.
on:
  schedule:
    - cron: "0 7 * * 1"      # weekly, Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new pipelines to add this run (0 = no limit)"
        default: "12"

permissions:
  contents: read

# Both maintenance bots publish to main: one at a time, so the second validates what the first
# published instead of a main that no longer exists.
concurrency:
  group: nfclaw-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      base: ${{ steps.base.outputs.sha }}
      sha: ${{ steps.candidate.outputs.sha }}
      pipelines: ${{ steps.candidate.outputs.pipelines }}
      artifact: ${{ steps.archive.outputs.artifact-id }}
    env:
      NXF_ANSI_LOG: "false"
      NFCLAW_KEEP_SUBMODULES: "1"   # keep newly-added submodules initialised for publication
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Bind preparation to the same commit as the reusable workflow definitions.
          ref: ${{ github.sha }}
          submodules: recursive     # existing pipelines, so the drift gate can regenerate them
          fetch-depth: 0
          # This job runs upstream pipeline code (Nextflow parses each new release's Groovy config).
          # Keep the write token out of .git/config; only the publication step authenticates its push.
          persist-credentials: false
      - name: Record the validated base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Existing submodules need their tags present so `git describe --tags` resolves each
      # pinned version deterministically (the drift gate compares regenerated context).
      - name: Fetch submodule tags
        run: git submodule foreach 'git fetch -q --tags origin 2>/dev/null || true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      # The YAML extra lets the final gate run the YAML params/samplesheet tests, as tests.yml does.
      - run: pip install -e ".[dev,yaml]" "pytest>=8,<10" ruff
      - uses: ./.github/actions/setup-nextflow
      - name: Discover, validate acceptance, keep only what Nextflow accepts
        id: disc
        env:
          # Through the environment, never `${{ }}` inside the script: a dispatched value is data.
          LIMIT: ${{ inputs.limit || '12' }}
        run: |
          # pipefail: a crashed discovery must fail the job, not read as "No new pipelines to add."
          set -eo pipefail
          python -m librarian.discover_pipelines --repo-root . --limit "$LIMIT" \
            | tee "$RUNNER_TEMP/disc.out"
          added=$(sed -nE 's/^([A-Za-z0-9._-]+): added at .*/\1/p' "$RUNNER_TEMP/disc.out")
          if [ -z "$added" ]; then
            echo "No new pipelines to add."
            echo "kept=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Does Nextflow accept each new pipeline? (per-pipeline verdicts in the result file)
          export NFCLAW_RESULT_FILE="$RUNNER_TEMP/accept.tsv"
          # One argument per added name: names match [A-Za-z0-9._-]+, so word splitting is exact.
          # shellcheck disable=SC2086
          bash scripts/nextflow_accept.sh $added || true
          kept=0
          # Require an explicit completed acceptance for EVERY added pipeline. A partial result
          # file, an unknown verdict or a staging failure cannot silently count as accepted.
          for name in $added; do
            verdict=$(awk -F '\t' -v pipeline="$name" '$1 == pipeline { print $2 }' "$NFCLAW_RESULT_FILE")
            case "$verdict" in
              accepted) kept=$((kept + 1)) ;;
              rejected|staging-unverified)
                echo "::warning::$name $verdict — dropping it from this batch"
                python -m librarian.discover_pipelines --repo-root . --rollback "$name"
                ;;
              *)
                echo "::error::$name has no unique recognized acceptance verdict"
                exit 1
                ;;
            esac
          done
          python -m librarian.write_catalog
          echo "kept=$kept" >> "$GITHUB_OUTPUT"
      - name: Freeze generated candidate
        id: candidate
        if: steps.disc.outputs.kept != '0'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python scripts/maintenance_candidate.py prepare --directory "$RUNNER_TEMP/candidate" --base "$BASE_SHA" --kind discover
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: archive
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: maintenance-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 90

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      base_sha: ${{ needs.prepare.outputs.base }}
      candidate_sha: ${{ needs.prepare.outputs.sha }}
      candidate_artifact: ${{ needs.prepare.outputs.artifact }}

  native:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.pipelines != '[]'
    permissions:
      contents: read
    uses: ./.github/workflows/maintenance-native.yml
    with:
      base_sha: ${{ needs.prepare.outputs.base }}
      candidate_sha: ${{ needs.prepare.outputs.sha }}
      candidate_artifact: ${{ needs.prepare.outputs.artifact }}
      pipelines: ${{ needs.prepare.outputs.pipelines }}

  drift:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: ./.github/actions/restore-maintenance-candidate
        with:
          artifact: ${{ needs.prepare.outputs.artifact }}
          base: ${{ needs.prepare.outputs.base }}
          sha: ${{ needs.prepare.outputs.sha }}
      - run: git submodule foreach 'git fetch -q --tags origin'
      - run: pip install -e .
      - run: python -m librarian.check_drift

  publish:
    needs: [prepare, validate, native, drift]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' &&
      needs.validate.result == 'success' && needs.drift.result == 'success' &&
      (needs.native.result == 'success' ||
       (needs.prepare.outputs.pipelines == '[]' && needs.native.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      checks: write
    steps:
      # Trusted base only: do not check out or execute candidate/upstream code in this job.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/maintenance-candidate
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: maintenance-pytest-${{ needs.prepare.outputs.sha }}-*
          path: ${{ runner.temp }}/maintenance-matrix
          merge-multiple: true
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: needs.prepare.outputs.pipelines != '[]'
        with:
          pattern: maintenance-native-${{ needs.prepare.outputs.sha }}-*
          path: ${{ runner.temp }}/maintenance-native
          merge-multiple: true
      - name: Publish validated update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/maintenance-candidate
          MATRIX_EVIDENCE_DIR: ${{ runner.temp }}/maintenance-matrix
          NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/maintenance-native
          VALIDATION_RESULT: ${{ needs.validate.result }}
          DRIFT_RESULT: ${{ needs.drift.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          UPDATE_KIND: discover
        run: bash scripts/publish_validated_update.sh
