name: discover-pipelines
# Find nf-core pipelines not yet in the library, scaffold each (pinned submodule
# + generated skill.md/reference.md + catalog), then VALIDATE them: unit tests,
# the drift gate and Nextflow acceptance (`-preview`). Pipelines that Nextflow
# cannot fully validate are dropped from the batch; if any survive and all checks pass, the PR
# is opened and auto-merged (which rebuilds the site).
on:
  schedule:
    - cron: "0 7 * * 1"      # weekly, Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new pipelines to add this run (0 = no limit)"
        default: "12"

permissions:
  contents: write
  pull-requests: write
  actions: write             # to dispatch the deploy after merge
  checks: write              # report completed in-job validation on the generated PR commit

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      NXF_ANSI_LOG: "false"
      NFCLAW_KEEP_SUBMODULES: "1"   # keep newly-added submodules initialised for the PR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive     # existing pipelines, so the drift gate can regenerate them
          fetch-depth: 0
          # This job runs upstream pipeline code (Nextflow parses each new release's Groovy config).
          # Keep the write token out of .git/config; create-pull-request authenticates on its own.
          persist-credentials: false
      # Existing submodules need their tags present so `git describe --tags` resolves each
      # pinned version deterministically (the drift gate compares regenerated context).
      - name: Fetch submodule tags
        run: git submodule foreach 'git fetch -q --tags origin 2>/dev/null || true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      # The YAML extra lets the final gate run the YAML params/samplesheet tests, as tests.yml does.
      - run: pip install -e ".[dev,yaml]" "pytest>=8,<10" ruff
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-nextflow
      - name: Discover, validate acceptance, keep only what Nextflow accepts
        id: disc
        env:
          # Through the environment, never `${{ }}` inside the script: a dispatched value is data.
          LIMIT: ${{ inputs.limit || '12' }}
        run: |
          # pipefail: a crashed discovery must fail the job, not read as "No new pipelines to add."
          set -eo pipefail
          python -m librarian.discover_pipelines --repo-root . --limit "$LIMIT" \
            | tee "$RUNNER_TEMP/disc.out"
          added=$(sed -nE 's/^([A-Za-z0-9._-]+): added at .*/\1/p' "$RUNNER_TEMP/disc.out")
          if [ -z "$added" ]; then
            echo "No new pipelines to add."
            echo "kept=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Does Nextflow accept each new pipeline? (per-pipeline verdicts in the result file)
          export NFCLAW_RESULT_FILE="$RUNNER_TEMP/accept.tsv"
          # One argument per added name: names match [A-Za-z0-9._-]+, so word splitting is exact.
          # shellcheck disable=SC2086
          bash scripts/nextflow_accept.sh $added || true
          kept=0
          # Require an explicit completed acceptance for EVERY added pipeline. A partial result
          # file, an unknown verdict or a staging failure cannot silently count as accepted.
          for name in $added; do
            verdict=$(awk -F '\t' -v pipeline="$name" '$1 == pipeline { print $2 }' "$NFCLAW_RESULT_FILE")
            case "$verdict" in
              accepted) kept=$((kept + 1)) ;;
              rejected|staging-unverified)
                echo "::warning::$name $verdict — dropping it from this batch"
                python -m librarian.discover_pipelines --repo-root . --rollback "$name"
                ;;
              *)
                echo "::error::$name has no unique recognized acceptance verdict"
                exit 1
                ;;
            esac
          done
          python -m librarian.write_catalog
          echo "kept=$kept" >> "$GITHUB_OUTPUT"
      # The site's markdown parser reads every generated skill.md. Its tests need node and the
      # site's TypeScript; no dependency install scripts run in this write-capable job.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.disc.outputs.kept != '0'
        with:
          node-version: 24
      - name: Install website dependencies
        if: steps.disc.outputs.kept != '0'
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The PR this job opens triggers no tests.yml run, so the complete gates must pass here.
      - name: Unit tests + drift gate
        if: steps.disc.outputs.kept != '0'
        run: |
          set -eo pipefail
          pytest -q --ignore=tests/test_nextflow_integration.py --ignore=tests/test_git_path_identity.py
          ruff check .
          pytest -q tests/test_nextflow_integration.py tests/test_git_path_identity.py
          pytest -q -rs tests/test_website_parsing.py | tee "$RUNNER_TEMP/website-parsing.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/website-parsing.log"; then
            echo "::error::website parsing tests were skipped instead of run"
            exit 1
          fi
          python -m librarian.check_drift
          npm --prefix website audit --audit-level=low
          npm --prefix website run typecheck
          npm --prefix website run build
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: success() && steps.disc.outputs.kept != '0'
        id: cpr
        with:
          # Least privilege: stage only what discovery generates. This list must name EVERY file
          # the job writes — anything missing is silently dropped from the PR, and the in-job drift
          # gate above cannot catch that (it runs against the complete working tree, before this
          # action decides what to commit). Discovery registers each new pipeline in sources.tsv
          # (`_append_source`) as well as in .gitmodules and pipelines/, so all three belong here.
          add-paths: |
            pipelines
            sources.tsv
            catalog.json
            catalog.md
            .gitmodules
          branch: auto-discover-pipelines
          title: "feat: add newly discovered nf-core pipelines"
          commit-message: "feat: add discovered nf-core pipelines + generated context"
          body: |
            Automated discovery: added nf-core pipelines (each pinned to its latest stable
            release) that pass the unit tests, the drift gate and Nextflow acceptance
            (`nextflow -preview`). Pipelines Nextflow rejected were dropped. Auto-merged
            because all checks passed.
      # Report the completed core checks on the exact generated commit, merge under
      # the normal branch rules, then explicitly deploy after the merge completes.
      - name: Auto-merge and redeploy
        if: success() && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: bash scripts/merge_validated_update.sh
