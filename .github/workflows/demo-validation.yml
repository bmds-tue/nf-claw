name: demo-validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runner/**"
      - "pipelines/demo/upstream"
      - "scripts/check_nftest_snapshot.py"
      - ".github/workflows/demo-validation.yml"

# A new push to a pull request supersedes the run of its previous commit, which would otherwise keep
# its queued runners (macOS ones especially) busy. Every other run is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  native-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NXF_ANSI_LOG: "false"
      SNAPSHOT: pipelines/demo/upstream/tests/default.nf.test.snap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: ./.github/actions/setup-nextflow
      - run: git submodule update --init --depth 1 pipelines/demo/upstream
      - name: Execute the pinned demo on native amd64
        run: |
          nfclaw run demo --demo --outdir "$RUNNER_TEMP/demo" --nxf-ver 25.10.4 \
            --limit-cpus 2 --limit-memory 2.GB --limit-time 15.min --timeout 900
      - name: Replay the recorded command into a fresh directory
        run: '"$RUNNER_TEMP/demo/provenance/commands.sh" "$RUNNER_TEMP/demo-replay"'
      # nf-core/demo's own test snapshot records the results its CI expects of this test: the stable
      # output paths and the checksum of every stable file (FastQC's statistics, the trimmed reads,
      # MultiQC's tables). Both runs are compared with it, so nfclaw is checked for changing none of
      # them; the tools themselves are upstream's to test.
      - name: Check both runs against the release's own nf-test snapshot
        run: |
          python scripts/check_nftest_snapshot.py "$SNAPSHOT" "$RUNNER_TEMP/demo" --test "-profile test"
          python scripts/check_nftest_snapshot.py "$SNAPSHOT" "$RUNNER_TEMP/demo-replay" --test "-profile test"
      - name: Check what nfclaw recorded and replayed
        run: |
          nfclaw verify "$RUNNER_TEMP/demo-replay" --against "$RUNNER_TEMP/demo"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          original = Path(os.environ["RUNNER_TEMP"]) / "demo"
          replay = original.with_name("demo-replay")
          manifest = json.loads((original / "provenance/run_manifest.json").read_text())
          if manifest["nextflow"] != "nextflow version 25.10.4":
              raise SystemExit(f"Executed engine identity was not recorded correctly: {manifest['nextflow']!r}")
          metadata = re.compile(r"params_\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}\.json")
          reports = [sorted(p for p in (root / "pipeline_info").iterdir() if metadata.fullmatch(p.name))
                     for root in (original, replay)]
          if any(len(files) != 1 for files in reports):
              raise SystemExit(f"Expected one upstream parameter report per run: {reports}")
          parameters = [json.loads(files[0].read_text()) for files in reports]
          for params in parameters:
              params.pop("outdir")
          if parameters[0] != parameters[1]:
              raise SystemExit("Replay changed upstream parameters beyond its output directory")
          print("Engine identity recorded; the replay ran the recorded parameters")
          PY
      - name: Check the recorded execution environment and its replay
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          bundle = temp / "demo/provenance"
          env = json.loads((bundle / "environment.json").read_text())
          if (env["container_engine"] or {}).get("name") != "docker":
              raise SystemExit(f"Container engine not recorded: {env['container_engine']}")
          if len(env["processes"]) < 4 or env["issues"]:
              raise SystemExit(f"Incomplete execution environment: {env['processes']} {env['issues']}")
          for name, image in env["images"].items():
              if image["kind"] != "registry" or not re.fullmatch(r"sha256:[0-9a-f]{64}", image.get("digest") or ""):
                  raise SystemExit(f"Image without a registry digest: {name}: {image}")
          if set(env["pinned_containers"]) != set(env["processes"]):
              raise SystemExit("Not every process is pinned to its image digest")
          if not env["remote_inputs"] or any("sha256" not in item for item in env["remote_inputs"].values()):
              raise SystemExit(f"Staged remote inputs not recorded: {env['remote_inputs']}")
          replay = json.loads((temp / "demo-replay/provenance/environment.json").read_text())
          refs = {c for entry in replay["processes"].values() for c in entry["containers"]}
          if not refs or not all("@sha256:" in ref for ref in refs):
              raise SystemExit(f"The replay did not run the pinned digests: {refs}")
          check = json.loads((temp / "demo-replay/provenance/environment_check.json").read_text())
          if check["status"] != "identical":
              raise SystemExit(f"Replay environment differs from the recording: {check}")
          used = json.loads((temp / "demo-replay/provenance/pipeline-source.json").read_text())
          if used["from"] != "checkout":
              raise SystemExit(f"The intact checkout was not replayed in place: {used}")
          print(f"{len(env['images'])} images pinned by digest for {len(env['processes'])} processes; "
                f"{len(env['remote_inputs'])} remote inputs; replay environment identical")
          PY
      - name: Replay from the bundle's source archive once the checkout is gone
        run: |
          mv pipelines/demo/upstream "$RUNNER_TEMP/demo-checkout-moved"
          "$RUNNER_TEMP/demo/provenance/commands.sh" "$RUNNER_TEMP/demo-archive-replay"
          mv "$RUNNER_TEMP/demo-checkout-moved" pipelines/demo/upstream
          python scripts/check_nftest_snapshot.py "$SNAPSHOT" "$RUNNER_TEMP/demo-archive-replay" --test "-profile test"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          replay = Path(os.environ["RUNNER_TEMP"]) / "demo-archive-replay"
          used = json.loads((replay / "provenance/pipeline-source.json").read_text())
          if used["from"] != "archive" or not (replay / "provenance/pipeline/main.nf").is_file():
              raise SystemExit(f"The replay did not run the bundle's source archive: {used}")
          check = json.loads((replay / "provenance/environment_check.json").read_text())
          if check["status"] != "identical":
              raise SystemExit(f"Archive replay environment differs from the recording: {check}")
          print("Archive replay ran the bundled source in an identical environment")
          PY
      - name: Retain native execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-demo-evidence
          path: |
            ${{ runner.temp }}/demo
            ${{ runner.temp }}/demo-replay
            work/**/.command.*
          include-hidden-files: true
          retention-days: 90

  apptainer-demo:
    # Image identities for an engine that runs local image files: each image is recorded by the
    # SHA-256 of its cached file (no registry digest to pin), and the replay must use the same bytes.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NXF_ANSI_LOG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: ./.github/actions/setup-nextflow
      - run: git submodule update --init --depth 1 pipelines/demo/upstream
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update -q
          sudo apt-get install -y -q apptainer
          # Ubuntu 24.04 restricts unprivileged user namespaces, which Apptainer uses.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          apptainer --version
      - name: Execute the pinned demo with Apptainer, replay it and verify
        run: |
          nfclaw run demo --demo -profile apptainer --outdir "$RUNNER_TEMP/demo" --nxf-ver 25.10.4 \
            --nxf-env "NXF_APPTAINER_CACHEDIR=$RUNNER_TEMP/apptainer" \
            --limit-cpus 2 --limit-memory 2.GB --limit-time 20.min --timeout 1800
          "$RUNNER_TEMP/demo/provenance/commands.sh" "$RUNNER_TEMP/demo-replay"
          nfclaw verify "$RUNNER_TEMP/demo-replay" --against "$RUNNER_TEMP/demo"
      - name: Check the recorded image files and the replay's comparison
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          env = json.loads((temp / "demo/provenance/environment.json").read_text())
          if (env["container_engine"] or {}).get("name") != "apptainer":
              raise SystemExit(f"Container engine not recorded: {env['container_engine']}")
          if len(env["processes"]) < 4 or not env["images"]:
              raise SystemExit(f"Incomplete execution environment: {env}")
          for name, image in env["images"].items():
              if image["kind"] != "file":
                  raise SystemExit(f"Image file not recorded by content: {name}: {image}")
              digest = hashlib.sha256(Path(image["path"]).read_bytes()).hexdigest()
              if digest != image["sha256"]:
                  raise SystemExit(f"Recorded image digest does not match the file: {name}")
          if (temp / "demo/provenance/containers.config").exists() or env["pinned_containers"]:
              raise SystemExit("Image files cannot be pinned by a registry digest")
          check = json.loads((temp / "demo-replay/provenance/environment_check.json").read_text())
          if check["status"] != "identical":
              raise SystemExit(f"Replay environment differs from the recording: {check}")
          print(f"{len(env['images'])} Apptainer image files recorded by SHA-256; replay environment identical")
          PY
      - name: Retain Apptainer execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apptainer-demo-evidence
          path: |
            ${{ runner.temp }}/demo/provenance
            ${{ runner.temp }}/demo-replay/provenance
          include-hidden-files: true
          retention-days: 90
