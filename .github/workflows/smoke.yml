name: smoke
# Verify every pipeline is actually usable through nfclaw WITHOUT running the
# (heavy) workflows themselves. For each pipeline this initializes the pinned
# submodule, parses its nextflow_schema.json, validates parameters, composes the
# test profile and builds + preflights the demo command — i.e. `nfclaw run
# --check --demo` stops just before execution. Scientific correctness of a
# release is nf-core's own CI's job; this guards what nf-claw owns (schema parse,
# generated command, submodule integrity) and stays cheap as the library grows.
on:
  push:
    branches: [main]
    paths:
      - "pipelines/**"
      - "runner/**"
      - "catalog.json"
      - "sources.tsv"
      - ".github/workflows/smoke.yml"
  schedule:
    - cron: "0 6 * * 3"      # weekly, Wednesday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # No submodules here: nfclaw shallow-inits each pipeline's submodule on demand.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: ./.github/actions/setup-nextflow
      - name: Build + preflight the demo command for every pipeline
        run: |
          fail=0
          {
            echo "## Pipeline smoke test"
            echo "| pipeline | result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! inventory=$(nfclaw list); then
            echo "::error::could not list pipelines — partial output is not a complete inventory"
            exit 1
          fi
          names=$(printf '%s\n' "$inventory" | cut -f1)
          if [ -z "$names" ]; then
            echo "::error::nfclaw list returned no pipelines — nothing would be checked"
            exit 1
          fi
          for name in $names; do
            out="$RUNNER_TEMP/smoke-$name"
            if nfclaw run "$name" --outdir "$out" --check --demo -profile docker > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "::group::✓ $name"; cat "$RUNNER_TEMP/$name.log"; echo "::endgroup::"
              echo "| \`$name\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$name failed the demo build/preflight"
              cat "$RUNNER_TEMP/$name.log"
              echo "| \`$name\` | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done
          exit $fail
      # Every chain the registry defines (handoffs/), with both stages on their test profile, is
      # validated the way `nfclaw chain run --check` does before a real chain: both stages'
      # parameters, the handoff against both pinned schemas, and that each stage's config parses.
      # Nothing executes.
      - name: Check every registry chain
        run: |
          fail=0
          {
            echo "## Chain check"
            echo "| chain | result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # Each stage runs on the engine its release declares (as nextflow_accept.sh does): a chain
          # pins it per stage, and an older release's config does not parse on Nextflow 26.
          declared() {
            ver=$(grep -hoE "nextflowVersion[[:space:]]*=[[:space:]]*'[^']+'" \
                  "pipelines/$1/upstream/nextflow.config" 2>/dev/null \
                  | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
            ver="${ver:-25.10.4}"
            if [ "$(printf '%s\n22.10.0\n' "$ver" | sort -V | head -1)" = "$ver" ] && [ "$ver" != "22.10.0" ]; then
              ver="24.10.5"
            fi
            echo "$ver"
          }
          if ! edges=$(nfclaw chain edges); then
            echo "::error::could not list chain edges — partial output is not a complete registry"
            exit 1
          fi
          # Read only the completed inventory; process substitution hides a failing producer.
          while IFS=$'\t' read -r up down _; do
            [ -n "$up" ] || continue
            spec="$RUNNER_TEMP/chain-$up-$down.json"
            # submodules are initialised on demand by nfclaw; the declared engine needs the tree
            git submodule update --init --depth 1 "pipelines/$up/upstream" "pipelines/$down/upstream" >/dev/null 2>&1 || true
            printf '{"stages": [{"pipeline": "%s", "demo": true, "nxf_ver": "%s"}, {"pipeline": "%s", "demo": true, "nxf_ver": "%s"}]}\n' \
              "$up" "$(declared "$up")" "$down" "$(declared "$down")" > "$spec"
            if nfclaw chain run "$spec" --outdir "$RUNNER_TEMP/chain-$up-$down" --check \
                > "$RUNNER_TEMP/chain-$up-$down.log" 2>&1; then
              echo "| \`$up\` → \`$down\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::chain $up -> $down failed its check"
              cat "$RUNNER_TEMP/chain-$up-$down.log"
              echo "| \`$up\` → \`$down\` | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done <<< "$edges"
          exit $fail
