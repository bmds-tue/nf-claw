name: nextflow-validate
# Verify Nextflow ACCEPTS every pipeline without running the analysis. For each
# pipeline this runs `nextflow run <upstream> -profile test,docker -preview`,
# which compiles the pipeline, resolves config + the test profile, runs the
# nf-schema parameter validation and builds the full task DAG — then stops
# before launching any task. It validates configuration and the preview DAG;
# it does not establish task execution or biological accuracy. Upstream release
# CI is separate evidence. Submodules are initialised one at a time and cleaned up, so
# disk stays bounded as the library grows.
#
# A pin is accepted when it is adopted: the maintenance bots run the same script on every changed
# pipeline before publishing, and a merge that moves a pin runs this workflow. Between pin changes
# the commit and engine stay the same, so the weekly run only watches what lives outside the
# repository (hosted test data, plugin releases).
on:
  schedule:
    - cron: "0 5 * * 2"      # weekly, Tuesday 05:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The pins and the gate itself. Generated docs (skill.md) do not enter a preview.
      - "sources.tsv"
      - ".gitmodules"
      - "pipelines/*/upstream"
      - "scripts/nextflow_accept.sh"
      - "scripts/nextflow_accept_exceptions.tsv"
      - ".github/workflows/nextflow-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    env:
      NXF_ANSI_LOG: "false"
    steps:
      # No upfront submodules: each pipeline is initialised on demand below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: ./.github/actions/setup-nextflow
      - name: Preview every pipeline through Nextflow (no task execution)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "8"
          NFCLAW_RESULT_FILE: ${{ runner.temp }}/acceptance.tsv
          NFCLAW_LOG_DIR: ${{ runner.temp }}/acceptance-logs
        run: |
          set -euo pipefail
          inventory=$(nfclaw list)
          if [ -z "$inventory" ]; then
            echo "::error::no pipelines found"
            exit 1
          fi
          names=()
          index=0
          while IFS=$'\t' read -r name _; do
            [ -n "$name" ] || continue
            if (( index % SHARD_COUNT == SHARD_INDEX )); then
              names+=("$name")
            fi
            index=$((index + 1))
          done <<< "$inventory"
          if (( ${#names[@]} )); then
            bash scripts/nextflow_accept.sh "${names[@]}"
          else
            echo "No pipelines assigned to this shard."
          fi
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextflow-acceptance-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/acceptance.tsv
            ${{ runner.temp }}/acceptance-logs
          retention-days: 90
