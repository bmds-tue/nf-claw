name: pipeline-execution
on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Pinned pipeline to execute with its bundled test profile
        required: true
        default: demo
        type: string
      nextflow_version:
        description: Optional concrete engine version; default is the release's declared minimum
        required: false
        type: string
      budget_minutes:
        description: Execution budget in minutes (whole run and each task); heavy bundled tests such as ampliseq need more than 30
        required: false
        default: 30
        type: number
  pull_request:
    paths:
      - ".github/workflows/pipeline-execution.yml"

# A new push to a pull request supersedes the run of its previous commit, which would otherwise keep
# its queued runners (macOS ones especially) busy. Every other run is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  native-pipeline:
    runs-on: ubuntu-latest
    # nfclaw's --timeout bounds the run; a dispatch may need up to the hosted maximum.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 40 }}
    env:
      PIPELINE: ${{ inputs.pipeline || 'demo' }}
      ENGINE_OVERRIDE: ${{ inputs.nextflow_version }}
      BUDGET_MINUTES: ${{ inputs.budget_minutes || 30 }}
      NXF_ANSI_LOG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Validate selection and initialize the pinned source
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from runner.discovery import discover
          from runner.engine_version import required_spec
          name = os.environ["PIPELINE"]
          root = Path.cwd()
          if name not in {pipeline.name for pipeline in discover(root / "pipelines")}:
              raise SystemExit("Unknown pipeline; select a name from nfclaw list")
          upstream = root / "pipelines" / name / "upstream"
          subprocess.run(["git", "submodule", "update", "--init", "--depth", "1", str(upstream)], check=True)
          version = os.environ.get("ENGINE_OVERRIDE", "")
          if not version:
              match = re.fullmatch(r"!?\s*>=?\s*(\d+\.\d+\.\d+)", required_spec(upstream / "nextflow.config") or "")
              if not match:
                  raise SystemExit("A concrete nextflow_version is required for this release")
              version = match[1]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?", version):
              raise SystemExit("nextflow_version must be a concrete release version")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"NXF_VER={version}\n")
          PY
      - uses: ./.github/actions/setup-nextflow
      - name: Execute the bundled analysis on native amd64
        run: |
          # A GitHub-hosted job ends at 360 minutes; keep ten for setup and evidence upload.
          if ! [[ "$BUDGET_MINUTES" =~ ^[0-9]+$ ]] || (( BUDGET_MINUTES < 1 || BUDGET_MINUTES > 350 )); then
            echo "::error::budget_minutes must be a whole number from 1 to 350"
            exit 1
          fi
          nfclaw run "$PIPELINE" --demo --outdir "$RUNNER_TEMP/analysis" --nxf-ver "$NXF_VER" \
            --limit-cpus 2 --limit-memory 6.GB --limit-time "$BUDGET_MINUTES.min" \
            --timeout "$(( BUDGET_MINUTES * 60 ))"
          nfclaw status "$RUNNER_TEMP/analysis"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "analysis/provenance/run_manifest.json").read_text())
          if manifest["nextflow"] != f"nextflow version {os.environ['NXF_VER']}":
              raise SystemExit(f"Executed engine identity was not recorded correctly: {manifest['nextflow']!r}")
          PY
      # upload-artifact refuses file names with characters such as ':' (ampliseq publishes
      # `ASV-badpairwise10::a.volcano_plot.svg`), which failed a successful run; tarballs keep
      # every published name, hidden file and task command exactly.
      - name: Package execution evidence
        if: always()
        run: |
          # pipefail: a failed task-command listing must not pass as a complete evidence archive.
          set -eo pipefail
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          if [ -d "$RUNNER_TEMP/analysis" ]; then
            tar -czf "$evidence/analysis.tar.gz" -C "$RUNNER_TEMP" analysis
          fi
          if [ -d work ]; then
            find work -name '.command.*' -print0 | tar --null -czf "$evidence/task-commands.tar.gz" -T -
          fi
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-pipeline-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 90
