name: deploy-pages
# Build the data-driven website as a static site and publish it to GitHub Pages.
# Runs on every push to main, so the site reflects the latest repository state
# (including merged auto-update PRs).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege per job: the build runs third-party code (`npm ci`, `next build`), so only the
# deploy job may publish to Pages or mint an OIDC token.
permissions:
  contents: read

# Allow only one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # src/lib/data/github.ts reads recent workflow runs at build time
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The data layer reads the pinned submodules (release dates, module
          # counts) and full git history (commit count, tags) at build time.
          submodules: recursive
          fetch-depth: 0
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build static site
        working-directory: website
        env:
          # Host the site under the Pages base path (e.g. "/nf-claw" for a
          # project site, empty for a user/org apex site).
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          # Build-time only: lets src/lib/data/github.ts bake live Actions runs
          # and releases into the Activity panel. Never shipped to the client.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
