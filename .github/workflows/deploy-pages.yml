name: deploy-pages
# Build the data-driven website as a static site and publish it to GitHub Pages.
# Runs on every push to main, so the site reflects the latest repository state
# (including the pipeline updates the maintenance workflows publish to main).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege per job: the build runs third-party code (`npm ci`, `next build`), so only the
# deploy job may publish to Pages or mint an OIDC token.
permissions:
  contents: read

# Allow only one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # src/lib/data/github.ts reads recent workflow runs at build time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The data layer reads the pinned submodules (release dates, module
          # counts) and the git history (commit feed, release tags) at build time.
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build static site
        working-directory: website
        env:
          # Host the site under the Pages base path (e.g. "/nf-claw" for a
          # project site, empty for a user/org apex site).
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          # Build-time only: lets src/lib/data/github.ts bake the latest Actions
          # runs into the Activity panel. Never shipped to the client.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
