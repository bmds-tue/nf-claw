name: auto-update
on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC
  workflow_dispatch:
# Both maintenance bots publish to main: one at a time, so the second validates what the first
# published instead of a main that no longer exists.
concurrency:
  group: nfclaw-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write          # to dispatch the deploy after merge
      checks: write           # report completed in-job validation on the generated PR commit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # main as it is when the job starts (a queued run's event commit can be stale).
          ref: main
          submodules: recursive
          fetch-depth: 0
          # This job runs upstream pipeline code (Nextflow parses each bumped release's Groovy
          # config). Keep the write token out of .git/config; create-pull-request authenticates
          # on its own.
          persist-credentials: false
      - name: Record the validated base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Ensure submodule tags are present so `git describe --tags` resolves the pinned
      # version deterministically (otherwise the in-job drift gate can fail spuriously).
      - name: Fetch submodule tags
        run: git submodule foreach 'git fetch -q --tags origin 2>/dev/null || true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      # The YAML extra lets the final gate run the YAML params/samplesheet tests, as tests.yml does.
      - run: pip install -e ".[dev,yaml]" "pytest>=8,<10" ruff
      - run: python -m librarian.update_pipelines --repo-root .
      - run: python -m librarian.write_catalog
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-nextflow
      # A release bump changes a staged gitlink. Validate only those pipelines through Nextflow;
      # this keeps the daily job bounded while preventing an incompatible release from being
      # auto-merged. Quoting the array preserves every validated pipeline slug as one argument.
      - name: Validate updated pipelines through Nextflow
        run: |
          # GitHub runs this step as `bash -e` without pipefail: a failed staged-diff inventory
          # must fail the job, not read as "No pipeline release changed." and skip acceptance.
          set -eo pipefail
          inventory=$(
            git diff --cached --name-only --diff-filter=AM \
              | sed -nE 's#^pipelines/([A-Za-z0-9._-]+)/upstream$#\1#p'
          )
          updated=()
          while IFS= read -r name; do
            [ -z "$name" ] || updated+=("$name")
          done <<< "$inventory"
          if (( ${#updated[@]} )); then
            export NFCLAW_RESULT_FILE="$RUNNER_TEMP/update-acceptance.tsv"
            NFCLAW_KEEP_SUBMODULES=1 bash scripts/nextflow_accept.sh "${updated[@]}"
            # Nightly checks can recognize a documented defect. Automated release bumps still
            # require a unique completed preview for every changed pipeline before auto-merge.
            for name in "${updated[@]}"; do
              verdict=$(awk -F '\t' -v pipeline="$name" '$1 == pipeline { if (NF == 2) print $2; else print "invalid" }' "$NFCLAW_RESULT_FILE")
              if [ "$verdict" != accepted ]; then
                echo "::error::$name has no unique completed Nextflow acceptance ($verdict)"
                exit 1
              fi
            done
          else
            echo "No pipeline release changed."
          fi
      # The site's markdown parser reads every regenerated skill.md. Its tests need node and the
      # site's TypeScript; no dependency install scripts run in this write-capable job.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install website dependencies
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      # PRs opened with GITHUB_TOKEN do not trigger the ordinary test/drift workflows, so the
      # complete local gates must pass here before this write-capable job opens or merges a PR.
      - name: Unit tests + final drift gate
        run: |
          set -eo pipefail
          pytest -q --ignore=tests/test_nextflow_integration.py --ignore=tests/test_git_path_identity.py
          ruff check .
          pytest -q tests/test_nextflow_integration.py tests/test_git_path_identity.py
          pytest -q -rs tests/test_website_parsing.py | tee "$RUNNER_TEMP/website-parsing.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/website-parsing.log"; then
            echo "::error::website parsing tests were skipped instead of run"
            exit 1
          fi
          python -m librarian.check_drift
          npm --prefix website audit --audit-level=low
          npm --prefix website run typecheck
          npm --prefix website run build
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        # An organization can forbid GitHub Actions from opening pull requests. The action pushes
        # the validated branch first; the next step tells that refusal from a real failure.
        continue-on-error: true
        with:
          # Least privilege: stage only what this job regenerates. Without it the action commits
          # every dirty path (`git add -A`), so any stray file a step leaves in the working tree
          # lands in an auto-merged commit.
          add-paths: |
            pipelines
            catalog.json
            catalog.md
            .gitmodules
          branch: auto-update-pipelines
          title: "chore: auto-update pipelines to latest releases"
          commit-message: "chore: bump pipelines + regenerate context"
          body: >-
            Automated: bumped submodules to latest release tags, regenerated
            skill.md/reference.md/catalog, and passed unit, drift, and Nextflow acceptance checks.
      - name: Propose the validated branch
        if: steps.cpr.outcome == 'failure'
        id: propose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          BRANCH: auto-update-pipelines
          TITLE: "chore: auto-update pipelines to latest releases"
          BODY: >-
            Automated: bumped submodules to latest release tags, regenerated
            skill.md/reference.md/catalog, and passed unit, drift, and Nextflow acceptance checks.
        run: bash scripts/propose_validated_update.sh
      # Report the completed core checks on the exact generated commit, merge under
      # the normal branch rules, then explicitly deploy after the merge completes.
      - name: Auto-merge and redeploy
        if: steps.cpr.outputs.pull-request-number || steps.propose.outputs.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number || steps.propose.outputs.number }}
          PR_HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha || steps.propose.outputs.head_sha }}
        run: bash scripts/merge_validated_update.sh
