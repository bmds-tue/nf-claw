name: auto-update
on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write          # to dispatch the deploy after merge
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          # This job runs upstream pipeline code (Nextflow parses each bumped release's Groovy
          # config). Keep the write token out of .git/config; create-pull-request authenticates
          # on its own.
          persist-credentials: false
      # Ensure submodule tags are present so `git describe --tags` resolves the pinned
      # version deterministically (otherwise the in-job drift gate can fail spuriously).
      - name: Fetch submodule tags
        run: git submodule foreach 'git fetch -q --tags origin 2>/dev/null || true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      # The YAML extra lets the final gate run the YAML params/samplesheet tests, as tests.yml does.
      - run: pip install -e ".[dev,yaml]" "pytest>=8,<10"
      - run: python -m librarian.update_pipelines --repo-root .
      - run: python -m librarian.write_catalog
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-nextflow
      # A release bump changes a staged gitlink. Validate only those pipelines through Nextflow;
      # this keeps the daily job bounded while preventing an incompatible release from being
      # auto-merged. Quoting the array preserves every validated pipeline slug as one argument.
      - name: Validate updated pipelines through Nextflow
        run: |
          mapfile -t updated < <(
            git diff --cached --name-only --diff-filter=AM \
              | sed -nE 's#^pipelines/([A-Za-z0-9._-]+)/upstream$#\1#p'
          )
          if (( ${#updated[@]} )); then
            NFCLAW_KEEP_SUBMODULES=1 bash scripts/nextflow_accept.sh "${updated[@]}"
          else
            echo "No pipeline release changed."
          fi
      # PRs opened with GITHUB_TOKEN do not trigger the ordinary test/drift workflows, so the
      # complete local gates must pass here before this write-capable job opens or merges a PR.
      - name: Unit tests + final drift gate
        run: |
          pytest -q
          python -m librarian.check_drift
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          # Least privilege: stage only what this job regenerates. Without it the action commits
          # every dirty path (`git add -A`), so any stray file a step leaves in the working tree
          # lands in an auto-merged commit.
          add-paths: |
            pipelines
            catalog.json
            catalog.md
            .gitmodules
          branch: auto-update-pipelines
          title: "chore: auto-update pipelines to latest releases"
          commit-message: "chore: bump pipelines + regenerate context"
          body: >-
            Automated: bumped submodules to latest release tags, regenerated
            skill.md/reference.md/catalog, and passed unit, drift, and Nextflow acceptance checks.
      # The in-job drift gate above already validated the change, so the PR is
      # safe to merge automatically. The merge push is made with GITHUB_TOKEN
      # and so does not trigger the push-driven deploy — dispatch it explicitly
      # (workflow_dispatch is exempt from the no-recursion rule).
      - name: Auto-merge and redeploy
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}"
          gh workflow run deploy-pages.yml --ref main
