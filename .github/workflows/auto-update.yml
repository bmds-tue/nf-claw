name: auto-update
on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC
  workflow_dispatch:
# Both maintenance bots publish to main: one at a time, so the second validates what the first
# published instead of a main that no longer exists.
concurrency:
  group: nfclaw-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write          # explicitly start push workflows after publication
      checks: write           # report completed in-job validation on the generated commit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # main as it is when the job starts (a queued run's event commit can be stale).
          ref: main
          submodules: recursive
          fetch-depth: 0
          # This job runs upstream pipeline code (Nextflow parses each bumped release's Groovy
          # config). Keep the write token out of .git/config; only the publication step
          # authenticates its push.
          persist-credentials: false
      - name: Record the validated base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Ensure submodule tags are present so `git describe --tags` resolves the pinned
      # version deterministically (otherwise the in-job drift gate can fail spuriously).
      - name: Fetch submodule tags
        run: git submodule foreach 'git fetch -q --tags origin 2>/dev/null || true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      # The YAML extra lets the final gate run the YAML params/samplesheet tests, as tests.yml does.
      - run: pip install -e ".[dev,yaml]" "pytest>=8,<10" ruff
      - run: python -m librarian.update_pipelines --repo-root .
      - run: python -m librarian.write_catalog
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-nextflow
      # A release bump changes a staged gitlink. Validate only those pipelines through Nextflow;
      # this keeps the daily job bounded while preventing an incompatible release from being
      # auto-merged. Quoting the array preserves every validated pipeline slug as one argument.
      - name: Validate updated pipelines through Nextflow
        run: |
          # GitHub runs this step as `bash -e` without pipefail: a failed staged-diff inventory
          # must fail the job, not read as "No pipeline release changed." and skip acceptance.
          set -eo pipefail
          inventory=$(
            git diff --cached --name-only --diff-filter=AM \
              | sed -nE 's#^pipelines/([A-Za-z0-9._-]+)/upstream$#\1#p'
          )
          updated=()
          while IFS= read -r name; do
            [ -z "$name" ] || updated+=("$name")
          done <<< "$inventory"
          if (( ${#updated[@]} )); then
            export NFCLAW_RESULT_FILE="$RUNNER_TEMP/update-acceptance.tsv"
            NFCLAW_KEEP_SUBMODULES=1 bash scripts/nextflow_accept.sh "${updated[@]}"
            # Nightly checks can recognize a documented defect. Automated release bumps still
            # require a unique completed preview for every changed pipeline before auto-merge.
            for name in "${updated[@]}"; do
              verdict=$(awk -F '\t' -v pipeline="$name" '$1 == pipeline { if (NF == 2) print $2; else print "invalid" }' "$NFCLAW_RESULT_FILE")
              if [ "$verdict" != accepted ]; then
                echo "::error::$name has no unique completed Nextflow acceptance ($verdict)"
                exit 1
              fi
            done
          else
            echo "No pipeline release changed."
          fi
      # The site's markdown parser reads every regenerated skill.md. Its tests need node and the
      # site's TypeScript; no dependency install scripts run in this write-capable job.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install website dependencies
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The complete local gates must pass before this write-capable job can publish a commit.
      - name: Unit tests + final drift gate
        run: |
          set -eo pipefail
          pytest -q --ignore=tests/test_nextflow_integration.py --ignore=tests/test_git_path_identity.py
          ruff check .
          pytest -q tests/test_nextflow_integration.py tests/test_git_path_identity.py
          pytest -q -rs tests/test_website_parsing.py | tee "$RUNNER_TEMP/website-parsing.log"
          if grep -q "SKIPPED" "$RUNNER_TEMP/website-parsing.log"; then
            echo "::error::website parsing tests were skipped instead of run"
            exit 1
          fi
          python -m librarian.check_drift
          npm --prefix website audit --audit-level=low
          npm --prefix website run typecheck
          npm --prefix website run build
      - name: Publish validated update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          UPDATE_KIND: update
        run: bash scripts/publish_validated_update.sh
