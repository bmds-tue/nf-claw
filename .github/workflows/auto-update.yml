name: auto-update
on:
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC
  workflow_dispatch:
# Both maintenance bots publish to main: one at a time, so the second validates what the first
# published instead of a main that no longer exists.
concurrency:
  group: nfclaw-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      base: ${{ steps.base.outputs.sha }}
      sha: ${{ steps.candidate.outputs.sha }}
      pipelines: ${{ steps.candidate.outputs.pipelines }}
      artifact: ${{ steps.archive.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Bind preparation to the same commit as the reusable workflow definitions.
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
          # This job runs upstream pipeline code (Nextflow parses each bumped release's Groovy
          # config). Keep the write token out of .git/config; only the publication step
          # authenticates its push.
          persist-credentials: false
      - name: Record the validated base
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Ensure submodule tags are present so `git describe --tags` resolves the pinned
      # version deterministically (otherwise the in-job drift gate can fail spuriously).
      - name: Fetch submodule tags
        run: git submodule foreach 'git fetch -q --tags origin 2>/dev/null || true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # The YAML extra lets the final gate run the YAML params/samplesheet tests, as tests.yml does.
      - run: pip install -e ".[dev,yaml]" "pytest>=8,<10" ruff
      - run: python -m librarian.update_pipelines --repo-root .
      - run: python -m librarian.write_catalog
      - uses: ./.github/actions/setup-nextflow
      # A release bump changes a staged gitlink. Validate only those pipelines through Nextflow;
      # this keeps the daily job bounded while preventing an incompatible release from being
      # published. Quoting the array preserves every validated pipeline slug as one argument.
      - name: Validate updated pipelines through Nextflow
        run: |
          # GitHub runs this step as `bash -e` without pipefail: a failed staged-diff inventory
          # must fail the job, not read as "No pipeline release changed." and skip acceptance.
          set -eo pipefail
          inventory=$(
            git diff --cached --name-only --diff-filter=AM \
              | sed -nE 's#^pipelines/([A-Za-z0-9._-]+)/upstream$#\1#p'
          )
          updated=()
          while IFS= read -r name; do
            [ -z "$name" ] || updated+=("$name")
          done <<< "$inventory"
          if (( ${#updated[@]} )); then
            export NFCLAW_RESULT_FILE="$RUNNER_TEMP/update-acceptance.tsv"
            NFCLAW_KEEP_SUBMODULES=1 bash scripts/nextflow_accept.sh "${updated[@]}"
            # The weekly preview can recognize a documented defect. Automated release bumps still
            # require a unique completed preview for every changed pipeline before publication.
            for name in "${updated[@]}"; do
              verdict=$(awk -F '\t' -v pipeline="$name" '$1 == pipeline { if (NF == 2) print $2; else print "invalid" }' "$NFCLAW_RESULT_FILE")
              if [ "$verdict" != accepted ]; then
                echo "::error::$name has no unique completed Nextflow acceptance ($verdict)"
                exit 1
              fi
            done
          else
            echo "No pipeline release changed."
          fi
      - name: Freeze generated candidate
        id: candidate
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: python scripts/maintenance_candidate.py prepare --directory "$RUNNER_TEMP/candidate" --base "$BASE_SHA" --kind update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: archive
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: maintenance-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 90

  # The matrix, real-task and drift gates on this exact candidate, then the isolated publisher;
  # every gate job runs read-only, and only the publisher uses these write permissions.
  gate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: write
      actions: write
      checks: write
    uses: ./.github/workflows/maintenance-gate.yml
    with:
      base_sha: ${{ needs.prepare.outputs.base }}
      candidate_sha: ${{ needs.prepare.outputs.sha }}
      candidate_artifact: ${{ needs.prepare.outputs.artifact }}
      pipelines: ${{ needs.prepare.outputs.pipelines }}
      kind: update
