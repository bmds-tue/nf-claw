name: fastqrepair-validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runner/**"
      - "pipelines/fastqrepair/upstream"
      - "scripts/check_fastqrepair_pairs.py"
      - "tests/test_fastqrepair_pairs.py"
      - "tests/test_git_path_identity.py"
      - "scripts/check_fastqrepair_wipe.py"
      - "tests/test_fastqrepair_wipe.py"
      - ".github/workflows/fastqrepair-validation.yml"

permissions:
  contents: read

jobs:
  native-pairs:
    strategy:
      fail-fast: false
      matrix:
        source: [plain, gzip]
        control: [suffixed, unsuffixed, single, single-end, skip-pairing, phred64]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NXF_ANSI_LOG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: ./.github/actions/setup-nextflow
      - run: git submodule update --init --depth 1 pipelines/fastqrepair/upstream
      - name: Verify correction selection with a Unicode source parent
        run: pytest -q tests/test_git_path_identity.py -k correction_selection
      - name: Create known pairs, reordered mates and singleton controls
        run: |
          source_args=()
          if [ '${{ matrix.source }}' = gzip ]; then source_args+=(--gzip); fi
          if [ '${{ matrix.control }}' != suffixed ]; then source_args+=(--unsuffixed); fi
          if [ '${{ matrix.control }}' = single ]; then source_args+=(--single-record); fi
          if [ '${{ matrix.control }}' = single-end ]; then source_args+=(--single-end); fi
          python scripts/check_fastqrepair_pairs.py fixture "$RUNNER_TEMP/paired-fixture" "${source_args[@]}"
      - name: Execute the pinned repair with perturbed task arrival order
        run: |
          splits=2
          if [ '${{ matrix.control }}' = single ]; then splits=1; fi
          run_args=()
          if [ '${{ matrix.control }}' = skip-pairing ]; then run_args+=(--skip-bbmap-repair true); fi
          if [ '${{ matrix.control }}' = phred64 ]; then run_args+=(--qin 64); fi
          nfclaw run fastqrepair --input "$RUNNER_TEMP/paired-fixture/samples.csv" \
            --outdir "$RUNNER_TEMP/paired-run" -profile docker --nxf-ver 25.10.4 \
            --config "$RUNNER_TEMP/paired-fixture/arrival.config" \
            --num-splits "$splits" --limit-cpus 2 --limit-memory 2.GB --limit-time 15.min --timeout 900 "${run_args[@]}"
          source_args=()
          if [ '${{ matrix.source }}' = gzip ]; then source_args+=(--gzip); fi
          if [ '${{ matrix.control }}' != suffixed ]; then source_args+=(--unsuffixed); fi
          if [ '${{ matrix.control }}' = single ]; then source_args+=(--single-record); fi
          if [ '${{ matrix.control }}' = single-end ]; then source_args+=(--single-end); fi
          if [ '${{ matrix.control }}' = skip-pairing ]; then source_args+=(--skip-pairing); fi
          if [ '${{ matrix.control }}' = phred64 ]; then source_args+=(--phred64); fi
          python scripts/check_fastqrepair_pairs.py check "$RUNNER_TEMP/paired-run" "${source_args[@]}"
      - name: Re-execute and verify exact read conservation and mate identity
        run: |
          "$RUNNER_TEMP/paired-run/provenance/commands.sh" "$RUNNER_TEMP/paired-replay"
          source_args=()
          if [ '${{ matrix.source }}' = gzip ]; then source_args+=(--gzip); fi
          if [ '${{ matrix.control }}' != suffixed ]; then source_args+=(--unsuffixed); fi
          if [ '${{ matrix.control }}' = single ]; then source_args+=(--single-record); fi
          if [ '${{ matrix.control }}' = single-end ]; then source_args+=(--single-end); fi
          if [ '${{ matrix.control }}' = skip-pairing ]; then source_args+=(--skip-pairing); fi
          if [ '${{ matrix.control }}' = phred64 ]; then source_args+=(--phred64); fi
          python scripts/check_fastqrepair_pairs.py check "$RUNNER_TEMP/paired-replay" --source-run "$RUNNER_TEMP/paired-run" "${source_args[@]}"
      - name: Retain source reads, task commands, outputs and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastqrepair-pair-evidence-${{ matrix.source }}-${{ matrix.control }}
          path: |
            ${{ runner.temp }}/paired-fixture
            ${{ runner.temp }}/paired-run
            ${{ runner.temp }}/paired-replay
            work/**/.command.*
          include-hidden-files: true
          retention-days: 90

  native-wipe:
    strategy:
      fail-fast: false
      matrix:
        source: [plain, gzip]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NXF_ANSI_LOG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: ./.github/actions/setup-nextflow
      - run: git submodule update --init --depth 1 pipelines/fastqrepair/upstream
      - name: Create damaged, single-read, '@'-quality and repaired-header controls
        run: |
          source_args=()
          if [ '${{ matrix.source }}' = gzip ]; then source_args+=(--gzip); fi
          python scripts/check_fastqrepair_wipe.py fixture "$RUNNER_TEMP/wipe-fixture" "${source_args[@]}"
      - name: Repair in three chunks and compare with one whole-file wipe
        run: |
          nfclaw run fastqrepair --input "$RUNNER_TEMP/wipe-fixture/samples.csv" \
            --outdir "$RUNNER_TEMP/wipe-run" -profile docker --nxf-ver 25.10.4 \
            --num-splits 3 --limit-cpus 2 --limit-memory 2.GB --limit-time 15.min --timeout 900
          python scripts/check_fastqrepair_wipe.py check "$RUNNER_TEMP/wipe-run"
      - name: Re-execute and compare again
        run: |
          "$RUNNER_TEMP/wipe-run/provenance/commands.sh" "$RUNNER_TEMP/wipe-replay"
          python scripts/check_fastqrepair_wipe.py check "$RUNNER_TEMP/wipe-replay" --source-run "$RUNNER_TEMP/wipe-run"
      - name: Retain source reads, task commands, outputs and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastqrepair-wipe-evidence-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/wipe-fixture
            ${{ runner.temp }}/wipe-run
            ${{ runner.temp }}/wipe-replay
            work/**/.command.*
          include-hidden-files: true
          retention-days: 90
