name: maintenance-native
on:
  workflow_call:
    inputs:
      base_sha:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      candidate_artifact:
        required: true
        type: string
      pipelines:
        required: true
        type: string
permissions:
  contents: read
jobs:
  execute:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pipeline: ${{ fromJSON(inputs.pipelines) }}
    runs-on: ubuntu-latest
    # nfclaw's --timeout bounds the analysis; the rest is setup and evidence upload.
    timeout-minutes: 110
    env:
      PIPELINE: ${{ matrix.pipeline }}
      BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      NXF_ANSI_LOG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: ./.github/actions/restore-maintenance-candidate
        with:
          artifact: ${{ inputs.candidate_artifact }}
          base: ${{ inputs.base_sha }}
          sha: ${{ inputs.candidate_sha }}
      - run: pip install -e ".[yaml]"
      - uses: ./.github/actions/setup-nextflow
      - name: Select a concrete compatible engine
        run: |
          set -euo pipefail
          version=$(python scripts/maintenance_candidate.py engine --directory "$RUNNER_TEMP/maintenance-candidate" \
            --base "$BASE_SHA" --sha "$CANDIDATE_SHA" --pipeline "$PIPELINE")
          echo "NXF_VER=$version" >> "$GITHUB_ENV"
      - name: Execute actual bundled tasks
        run: |
          set -euo pipefail
          # 90 minutes for the whole analysis: ampliseq 3.1.0's bundled test, about 100 tasks that
          # each fit the 30-minute task ceiling, was still running at 30 minutes on this runner.
          nfclaw run "$PIPELINE" --demo --outdir "$RUNNER_TEMP/analysis" --nxf-ver "$NXF_VER" \
            --limit-cpus 2 --limit-memory 6.GB --limit-time 30.min --timeout 5400
          nfclaw status "$RUNNER_TEMP/analysis"
          evidence="$RUNNER_TEMP/native-evidence/$PIPELINE"
          mkdir -p "$evidence/provenance" "$evidence/pipeline_info"
          python scripts/maintenance_candidate.py native --directory "$RUNNER_TEMP/maintenance-candidate" \
            --base "$BASE_SHA" --sha "$CANDIDATE_SHA" --pipeline "$PIPELINE" \
            --analysis "$RUNNER_TEMP/analysis" --output "$evidence/native.json"
          cp -- "$RUNNER_TEMP/analysis/provenance/run_manifest.json" "$evidence/provenance/"
          # The validator required exactly one trace. Preserve its bytes for fresh publisher checks.
          cp -- "$RUNNER_TEMP/analysis"/pipeline_info/execution_trace*.txt "$evidence/pipeline_info/"
      - name: Retain diagnostic evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-diagnostics"
          git rev-parse HEAD > "$RUNNER_TEMP/native-diagnostics/checkout.txt"
          if [ -d "$RUNNER_TEMP/analysis" ]; then
            tar -czf "$RUNNER_TEMP/native-diagnostics/analysis.tar.gz" -C "$RUNNER_TEMP" analysis
          fi
          if [ -d work ]; then
            find work -name '.command.*' -print0 | tar --null -czf "$RUNNER_TEMP/native-diagnostics/task-commands.tar.gz" -T -
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: maintenance-diagnostics-${{ inputs.candidate_sha }}-${{ matrix.pipeline }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-diagnostics
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: maintenance-native-${{ inputs.candidate_sha }}-${{ matrix.pipeline }}
          path: ${{ runner.temp }}/native-evidence
          if-no-files-found: error
          retention-days: 90
