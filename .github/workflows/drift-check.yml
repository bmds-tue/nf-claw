name: drift-check
on:
  pull_request:
  # Also check the default branch on a schedule, independently of the maintenance jobs' drift
  # gates. Their GITHUB_TOKEN pushes do not trigger ordinary push workflows.
  schedule:
    - cron: "0 7 * * *"      # daily 07:00 UTC, after the 06:00 auto-update
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # `git describe --tags` resolves each pinned release version, but actions/checkout does
      # not fetch submodule tags — without them the version falls back to a commit hash and the
      # drift gate fails spuriously. Fetch the tags so resolution is deterministic.
      - name: Fetch submodule tags
        run: git submodule foreach 'git fetch -q --tags origin 2>/dev/null || true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m librarian.check_drift
